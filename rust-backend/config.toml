# ImmoGuinée Rust backend — base config (overridable by IMMOG_* env vars).
# Non-secret defaults only. Secrets live in Vault in production.

host = "0.0.0.0"
port = 8000
database_url = "postgres://immog_user:immog@localhost:5433/immog_db"
redis_url = "redis://:immog_redis_secret@localhost:6379"
vault_addr = ""
vault_approle_role_id = ""
jwt_secret_vault_path = "secret/immoguinee/app"
cors_allowed_origin = "*"
body_limit_bytes = 10485760
request_timeout_secs = 60
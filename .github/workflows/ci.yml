name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feat/**', 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# C1 — moindre privilège : aucun job n'écrit dans le repo ni ne pousse d'image
# (build-docker a push: false). On révoque donc le défaut `write-all` des tokens
# GITHUB_TOKEN : `contents: read` suffit au checkout ; les jobs n'ont pas besoin
# de plus. Un job qui aurait besoin d'écrire (ex. release) ré-ouverait sa propre
# permission explicite — jamais le niveau racine.
permissions:
  contents: read

jobs:
  # Backend Tests (Rust / Axum). No external toolchain action: ubuntu-latest ships
  # rustup + a recent stable, and the repo's Actions policy only allows actions/*,
  # docker/* and shivammathur/setup-php@* (all SHA-pinned).
  backend-tests:
    name: Backend Tests (Rust)
    runs-on: ubuntu-latest
    # rust-backend/.cargo/config.toml sets rustc-wrapper=sccache (host-only speed-up).
    # sccache isn't on the CI runner → disable it, like the Dockerfile does.
    env:
      RUSTC_WRAPPER: ''
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ensure Rust components
        run: |
          rustup show active-toolchain || rustup default stable
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --all-targets

      # Unit tests only (no DB). The e2e suite needs Postgres/Redis/MinIO via
      # testcontainers — run locally or in a dedicated nightly job.
      - name: Unit tests
        run: cargo test --lib
        env:
          SQLX_OFFLINE: 'true'

  # Frontend Tests (Next.js)
  frontend-tests:
    name: Frontend Tests (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      # ⚠️ ADVISORY (continue-on-error) — dette technique front.
      # Le frontend accumule ~262 erreurs TypeScript pré-existantes (types
      # auto-générés .next, tests e2e, lib/api, app/…). Tant que cette dette
      # n'est pas résorbée (tâche dédiée), lint/type-check/build ne doivent pas
      # bloquer le merge : on les garde advisory pour signaler la régression
      # sans casser l'intégration. Les GATES SÉCURITÉ (job security-audit)
      # restent, elles, strictement bloquantes — c'est le cœur du correctif S3.
      # TODO(front-debt): remettre ces 3 étapes bloquantes une fois les erreurs
      # TS corrigées (voir tâche de suivi « Apurer 262 erreurs TS frontend »).
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript check
        run: npm run type-check
        continue-on-error: true

      - name: Build application
        run: npm run build
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: /api

  # Mobile Tests (React Native / Expo + Jest). Le mobile ne se build pas en CI
  # (Expo build nécessite un compte EAS) — on exécute juste les tests unitaires
  # Jest (hooks, utils) qui valident la logique hors device. C3 : couverture CI du
  # mobile, jusqu'ici absent du pipeline.
  mobile-tests:
    name: Mobile Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Jest unit tests
        run: npm test -- --ci --passWithNoTests

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: '' # sccache (config.toml) is host-only; not installed on CI
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Audit Rust dependencies
        working-directory: rust-backend
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit NPM dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  # Build Docker Images (only on main/develop)
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build backend image (Rust)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./rust-backend
          file: ./rust-backend/Dockerfile
          push: false
          tags: immoguinee-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: immoguinee-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

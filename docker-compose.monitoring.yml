version: '3.8'

# ============================================================================
# ⚠️ DEPRECATED — NE PAS UTILISER EN PRODUCTION
# ----------------------------------------------------------------------------
# Version LEGACY de la stack monitoring. Secrets en dur neutralisés (placeholders ${VAR}).
# Le chemin ACTIF est dans docker/ (voir docker/docker-compose.yml, services monitoring).
# Ne pas exécuter tel quel — nécessite des variables d'env réelles.
# ============================================================================

# Stack de monitoring pour ImmoGuinée
# Déployer avec: docker stack deploy -c docker-compose.monitoring.yml immog-monitoring

networks:
  immog-network:
    external: true
  monitoring:
    driver: overlay
    attachable: true

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

services:
  # Prometheus - Collecte des métriques
  prometheus:
    # C4 — épinglé (fichier legacy, voir avertissement en tête de fichier).
    image: prom/prometheus:v3.13.1
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.immoguinee.com`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - immog-network
      - monitoring

  # Grafana - Visualisation des métriques
  grafana:
    # C4 — épinglé (fichier legacy).
    image: grafana/grafana:13.0.3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.immoguinee.com`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.immoguinee.com
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - immog-network
      - monitoring

  # Node Exporter - Métriques du serveur
  node-exporter:
    # C4 — épinglé (fichier legacy).
    image: prom/node-exporter:v1.12.1
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  # cAdvisor - Métriques des conteneurs
  cadvisor:
    # C4 — épinglé. cAdvisor a migré gcr.io -> ghcr.io/google/cadvisor depuis v0.54.
    image: ghcr.io/google/cadvisor:v0.60.5
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  # Alertmanager - Gestion des alertes
  alertmanager:
    # C4 — épinglé (fichier legacy).
    image: prom/alertmanager:v0.33.1
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.alertmanager.rule=Host(`alerts.immoguinee.com`)"
        - "traefik.http.routers.alertmanager.entrypoints=websecure"
        - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
        - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - immog-network
      - monitoring

  # Postgres Exporter - Métriques PostgreSQL
  postgres-exporter:
    # C4 — épinglé (fichier legacy).
    image: prometheuscommunity/postgres-exporter:v0.20.1
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      - DATA_SOURCE_NAME=postgresql://immog_user:${DB_PASSWORD:?set DB_PASSWORD in .env}@postgres:5432/immog_db?sslmode=disable
    networks:
      - immog-network
      - monitoring

  # Redis Exporter - Métriques Redis
  redis-exporter:
    # C4 — épinglé (fichier legacy).
    image: oliver006/redis_exporter:v1.88.0
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - immog-network
      - monitoring

  # Elasticsearch Exporter - Métriques Elasticsearch
  elasticsearch-exporter:
    # C4 — épinglé (fichier legacy). ⚠️ Elasticsearch n'est plus utilisé par la
    # stack Rust (PostgreSQL only) — cet exporter est probablement un reliquat
    # de l'ancienne stack Laravel ; à retirer lors du nettoyage monitoring.
    image: prometheuscommunity/elasticsearch-exporter:v1.11.0
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    command:
      - '--es.uri=http://elasticsearch:9200'
    networks:
      - immog-network
      - monitoring
